name: Kernel Builder

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-22.2

jobs:
  build-kernel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git flex bison ccache gcc g++ make libncurses5-dev curl unzip

    - name: Clone Proton Clang toolchain
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/proton-clang

    - name: Setup kernel variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV

    - name: Build defconfig
      run: |
        make O=out ARCH=arm64 vendor/kona_defconfig vendor/xiaomi/umi.config

    - name: Merge LXC config
      run: |
        ./scripts/kconfig/merge_config.sh out/.config lxc.config

    - name: Merge Docker config
      run: |
        ./scripts/kconfig/merge_config.sh out/.config docker.config

    - name: Apply KernelSU Next
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
    - name: Clean kernel source
      run: |
        make mrproper
         
    - name: Disable duplicate FTS driver
      run: |
        make O=out ARCH=arm64 olddefconfig
         ./scripts/config --file out/.config --disable CONFIG_TOUCHSCREEN_FTS_521
         ./scripts/config --file out/.config --enable CONFIG_TOUCHSCREEN_ST_FTS
        make O=out ARCH=arm64 olddefconfig

    - name: Build kernel
      run: |
        make -j$(nproc) \
          O=out \
          ARCH=arm64 \
          olddefconfig \
          CC=~/proton-clang/bin/clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=~/proton-clang/bin/aarch64-linux-gnu- \
          HOSTCC=gcc \
          HOSTCXX=g++ \
          Image.gz dtbs

    - name: Create Image.gz-dtb
      run: |
        cat out/arch/arm64/boot/Image out/arch/arm64/boot/dts/vendor/qcom/*.dtb > out/Image.gz-dtb
        gzip -f out/Image.gz-dtb

    - name: Build dtbo.img
      run: |
        mkdir -p out/dtbo_tmp
        cp out/arch/arm64/boot/dts/vendor/qcom/*.dtbo out/dtbo_tmp/
        dtboimg create --output out/dtbo.img out/dtbo_tmp/*.dtbo

    - name: Upload compiled kernel
      uses: actions/upload-artifact@v4
      with:
        name: umi-kernel-artifacts
        path: |
          out/Image.gz-dtb
          out/dtbo.img
