name: Kernel Builder

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-22.2

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install git flex bison ccache libncurses5-dev build-essential
        
    - name: Clone toolchain and set path
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/proton-clang
        echo "PATH=~/proton-clang/bin:$PATH" >> $GITHUB_ENV
        
    - name: Configure and build kernel
      run: |
        # 设置交叉编译变量
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        
        # 设置主机编译变量
        export HOSTCC=gcc
        export HOSTLD=ld
        
        # 加载基础配置并合并
        make vendor/kona_defconfig
        ./scripts/kconfig/merge_config.sh .config arch/arm64/configs/vendor/xiaomi/umi.config
        ./scripts/kconfig/merge_config.sh .config docker.config
        ./scripts/kconfig/merge_config.sh .config lxc.config
        # 应用 KernelSU 补丁
        # 你的仓库需要有 kernelsu 子模块: git submodule add https://github.com/KernelSU/KernelSU.git kernelsu
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        # 并行编译
        make -j$(nproc)
        
    - name: Upload compiled kernel
      uses: actions/upload-artifact@v4
      with:
        name: umi-kernel-artifacts
        path: arch/arm64/boot/Image.gz-dtb
