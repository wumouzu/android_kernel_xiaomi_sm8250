name: Kernel Builder

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-22.2

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install git flex bison ccache libncurses5-dev make
        
    - name: Clone toolchain (Proton Clang)
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/proton-clang
        echo "PATH=~/proton-clang/bin:$PATH" >> $GITHUB_ENV
        
    - name: Setup kernel variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "PATH=~/proton-clang/bin:$PATH" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
    - name: build config
      run: |
        make vendor/kona_defconfig vendor/xiaomi/umi.config
    - name: lxc
      run: |
        ./scripts/kconfig/merge_config.sh .config lxc.config
    - name: docker
      run: |
        ./scripts/kconfig/merge_config.sh .config docker.config
    - name: ksunext
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
        
    - name: Build kernel
      run: |
        export PATH=$HOME/proton-clang/bin:$PATH
        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-
        export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        export CC=clang
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export HOSTCC=gcc
        export HOSTCXX=g++

        PATH=$HOME/proton-clang/bin:$PATH \
        make -j$(nproc) O=out \
          ARCH=arm64 \
          CC=clang \
          CROSS_COMPILE=$HOME/proton-clang/bin/aarch64-linux-gnu- \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          LD=ld.lld \
          LLVM=1 \
          HOSTCC=gcc HOSTCXX=g++
        
    - name: Upload compiled kernel
      uses: actions/upload-artifact@v4
      with:
        name: umi-kernel-artifacts
        path: arch/arm64/boot/Image.gz-dtb
