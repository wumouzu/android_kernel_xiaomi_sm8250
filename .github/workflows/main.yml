name: Kernel Builder

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-22.2

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git flex bison ccache libncurses5-dev bc \
          libssl-dev gcc g++ make wget unzip

    - name: Clone Proton Clang
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git --depth=1 ~/proton-clang
        echo "PATH=$HOME/proton-clang/bin:$PATH" >> $GITHUB_ENV

    - name: Setup kernel variables
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "CC=clang" >> $GITHUB_ENV
        echo "CLANG_TRIPLE=aarch64-linux-gnu-" >> $GITHUB_ENV

    - name: Build defconfig
      run: |
        make vendor/kona_defconfig vendor/xiaomi/umi.config

    - name: Merge extra configs
      run: |
        chmod +x ./scripts/kconfig/merge_config.sh
        ./scripts/kconfig/merge_config.sh .config lxc.config docker.config

    - name: Add KernelSU
      run: |
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -

    - name: Build kernel
      run: |
        export PATH=$HOME/proton-clang/bin:$PATH
        make -j$(nproc) ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu-

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v4
      with:
        name: umi-kernel-artifacts
        path: |
          arch/arm64/boot/Image*
          arch/arm64/boot/dts/*.dtb
